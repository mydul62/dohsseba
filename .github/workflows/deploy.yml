name: 🚀 Auto Deploy to VPS (Docker)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS via Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🚀 Execute Remote SSH Commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 60s
          command_timeout: 15m
          script: |
            echo "🚀 Auto-deploying dohsSheba to VPS using Docker..."

            # 1. Pull Latest Code
            cd /var/www/dohsheba || cd /var/www/html/dohsheba || exit 1
            git fetch --all
            git reset --hard origin/main
            git pull origin main

            # 2. Run Database Migration if needed
            if [ -d "backend" ]; then
              cd backend
              npx prisma db push --skip-generate || true
              cd ..
            fi

            # 3. Build & Run Docker Containers (Zero Downtime Swap)
            echo "🐳 Building & Updating Docker Containers..."
            docker compose up -d --build --remove-orphans || docker-compose up -d --build --remove-orphans

            echo "🎉 Docker Auto-deployment finished successfully!"
