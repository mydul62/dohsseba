name: 🚀 Auto Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS Server
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🚀 Execute Remote SSH Commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 60s
          command_timeout: 10m
          script: |
            echo "🚀 Auto-deploying dohsheba to VPS..."

            # 1. Pull Latest Code
            cd /var/www/dohsheba || cd /var/www/html/dohsheba || exit 1
            git fetch --all
            git reset --hard origin/main
            git pull origin main

            # 2. Update Backend & Restart PM2
            echo "📦 Building Backend..."
            cd backend
            npm install
            npx prisma db execute --file prisma/migrations/20260811134714_make_slot_date_optional/migration.sql --schema prisma/schema.prisma || true
            npx prisma db push --accept-data-loss --skip-generate || npx prisma db push --skip-generate || true
            npx prisma generate
            npm run build
            fuser -k 5000/tcp || true
            pm2 restart project3-api --update-env || pm2 restart dohsheba-api --update-env || pm2 start dist/server.js --name "project3-api"

            # 3. Update Frontend & Restart PM2
            echo "📦 Building Frontend..."
            cd ../frontend
            npm install
            npm run build
            fuser -k 3000/tcp || true
            fuser -k 3002/tcp || true
            pm2 restart project3-web --update-env || pm2 restart dohsheba-web --update-env || pm2 start npm --name "project3-web" -- start -- -p 3002
            pm2 restart project-web --update-env || true

            pm2 save
            echo "🎉 Auto-deployment finished successfully!"
