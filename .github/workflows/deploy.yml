name: 🚀 Auto Deploy to VPS (Docker)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS via Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🚀 Execute Remote SSH Commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 60s
          command_timeout: 15m
          script: |
            echo "🚀 Auto-deploying dohsSheba to VPS using Docker..."

            # 1. Iterate over ALL matching VPS directories containing git repo
            FOUND_DIRS=()
            for dir in /var/www/shop.dohsedu.com /var/www/dohsedu /var/www/dohsheba /var/www/dohsSheba /var/www/dohs-sheba /var/www/html/dohsheba /root/dohsheba /root/dohsSheba /home/ubuntu/dohsheba /home/ubuntu/dohsSheba $(pwd); do
              if [ -d "$dir/.git" ] || [ -f "$dir/package.json" ]; then
                FOUND_DIRS+=("$dir")
              fi
            done

            for TARGET_DIR in "${FOUND_DIRS[@]}"; do
              echo "📂 Deploying in directory: $TARGET_DIR"
              cd "$TARGET_DIR" || continue
              git remote set-url origin https://github.com/mydul62/dohsseba.git || true
              git fetch --all || true
              git reset --hard origin/main || true
              git pull origin main || true

              # 2. Run Database Migration
              if [ -d "backend" ]; then
                (cd backend && npx prisma db push --skip-generate) || true
              fi

              # 3. Clean & Rebuild Frontend Next.js on VPS Host
              if [ -d "frontend" ]; then
                echo "🔨 Building Frontend Next.js in $TARGET_DIR..."
                (cd frontend && rm -rf .next && npm run build) || true
              fi

              # 4. Build & Run Docker Containers
              if [ -f "docker-compose.yml" ] || [ -f "docker-compose.yaml" ]; then
                echo "🐳 Building & Updating Docker Containers in $TARGET_DIR..."
                docker compose build --no-cache || true
                docker compose up -d --build --remove-orphans || docker-compose up -d --build --remove-orphans || true
                docker compose restart || true
              fi
            done

            # 5. Restart PM2 processes globally if PM2 is active
            if command -v pm2 &> /dev/null; then
              echo "🔄 Restarting PM2 processes..."
              pm2 restart all --update-env || pm2 reload all || true
            fi

            echo "🎉 Deployment completed successfully!"
