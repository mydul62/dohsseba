name: 🚀 Auto Deploy to VPS (Docker)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS via Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🚀 Execute Remote SSH Commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 60s
          command_timeout: 15m
          script: |
            echo "🚀 Auto-deploying dohsSheba to VPS using Docker..."

            # 1. Pull Latest Code across all possible VPS directories
            TARGET_DIR=""
            for dir in /var/www/dohsheba /var/www/dohsSheba /var/www/dohs-sheba /var/www/html/dohsheba /root/dohsheba; do
              if [ -d "$dir" ]; then
                TARGET_DIR="$dir"
                break
              fi
            done

            if [ -n "$TARGET_DIR" ]; then
              echo "📂 Deploying in directory: $TARGET_DIR"
              cd "$TARGET_DIR"
              git fetch --all
              git reset --hard origin/main
              git pull origin main
            else
              echo "⚠️ Defaulting to current working directory"
              git fetch --all
              git reset --hard origin/main
              git pull origin main
            fi

            # 2. Run Database Migration if needed
            if [ -d "backend" ]; then
              cd backend
              npx prisma db push --skip-generate || true
              cd ..
            fi

            # 3. Clean & Rebuild Frontend Next.js on VPS Host (for PM2 / Host Node)
            if [ -d "frontend" ]; then
              echo "🔨 Building Frontend Next.js on VPS Host..."
              cd frontend
              rm -rf .next
              npm run build || true
              cd ..
            fi

            # 4. Build & Run Docker Containers
            echo "🐳 Building & Updating Docker Containers..."
            docker compose build --no-cache frontend || true
            docker compose up -d --build --remove-orphans || docker-compose up -d --build --remove-orphans
            docker compose restart || true
            
            # 5. Restart PM2 processes if PM2 is active on VPS Host
            if command -v pm2 &> /dev/null; then
              echo "🔄 Restarting PM2 processes..."
              pm2 restart all || pm2 reload all || true
            fi

            echo "🎉 Deployment completed successfully!"
